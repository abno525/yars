{{define "content"}}
<div class="barestack">
<form class="barecard" method="post" action="/login">
  <div class="barefields">
    {{$name := .Form.Get "username"}}
    <label>Username<input name="username" value="{{$name}}" autocomplete="username" required{{if not $name}} autofocus{{end}}></label>
    <label>Password<input name="password" type="password" autocomplete="current-password" required{{if $name}} autofocus{{end}}></label>
  </div>
  <button class="btn primary barebtn">Log in</button>
</form>
{{with .Error}}<div class="barealert" role="alert" title="{{.}}"><span class="clip">{{.}}</span></div>{{end}}
</div>
{{end}}
