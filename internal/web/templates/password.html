{{define "content"}}
<div class="barestack">
<form class="barecard" method="post" action="/password" data-nosave>
  <div class="barefields">
    <div class="barehead"><h1>Set a new password</h1><span class="mono muted" title="{{.User.Username}}">{{.User.Username}}</span></div>
    <label>New password<input name="new" type="password" autocomplete="new-password" required minlength="10" autofocus></label>
    <label>Repeat<input name="repeat" type="password" autocomplete="new-password" required minlength="10"></label>
    <div class="barefoot"><button class="btn primary w152">Set password</button></div>
  </div>
</form>
{{with .Error}}<div class="barealert" role="alert" title="{{.}}"><span class="clip">{{.}}</span></div>{{end}}
</div>
{{end}}
