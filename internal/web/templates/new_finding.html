{{define "content"}}
<form class="card narrow" method="post" action="/e/{{.Eng.ID}}/findings/new">
  <h1>New finding</h1>
  <p class="muted">{{.Eng.Name}}</p>
  {{if .Error}}<p class="error">{{.Error}}</p>{{end}}
  <label>Title <input name="title" value="{{.Form.Get "title"}}" required autofocus></label>
  <div class="actions">
    <button class="btn primary w128">Create</button>
    <a class="btn secondary w128" href="/e/{{.Eng.ID}}">Cancel</a>
  </div>
</form>
{{end}}
