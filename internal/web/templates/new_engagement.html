{{define "content"}}
<div class="titlerow">
  <div class="titlecol"><h1>New engagement</h1></div>
  <div class="actions">
    <a class="btn secondary w128" href="/engagements">Cancel</a>
    <button class="btn primary w128" form="new-engagement">Create</button>
  </div>
</div>
<form id="new-engagement" class="panel neweng" method="post" action="/engagements/new">
  {{$idErr := or (index .FieldErrs "id") .Error}}{{$nameErr := index .FieldErrs "name"}}
  <div class="nefields two">
    <label class="nefield">ID<input class="monoin" name="id" value="{{.Form.Get "id"}}"{{if $idErr}} aria-invalid="true"{{end}} aria-describedby="id-err" required autofocus><span class="ferr" id="id-err">{{$idErr}}</span></label>
    <label class="nefield">Name<input name="name" value="{{.Form.Get "name"}}"{{if $nameErr}} aria-invalid="true"{{end}} aria-describedby="name-err" required><span class="ferr" id="name-err">{{$nameErr}}</span></label>
  </div>
  <label class="nefield flush">Client<input name="client" value="{{.Form.Get "client"}}"></label>
  <div class="nefields two">
    <label class="nefield">Start<input name="start" type="date" value="{{.Form.Get "start"}}"></label>
    <label class="nefield">End<input name="end" type="date" value="{{.Form.Get "end"}}"></label>
  </div>
  <fieldset class="neteam">
    <div class="neteamhead"><legend>Team</legend><button type="button" class="btn secondary w128" data-check-all="member">Add everyone</button></div>
    <div class="neteamlist">
      <label class="nemember me"><input type="checkbox" checked disabled aria-label="{{.User.Username}}"><span class="strong clip">{{.User.Username}}</span><span class="muted">{{.User.Role}}</span></label>
      {{range .Users}}<label class="nemember"><input type="checkbox" name="member" value="{{.Username}}"{{if checkedIn $.Form "member" .Username}} checked{{end}}><span class="strong clip">{{.Username}}</span><span class="muted">{{.Role}}</span></label>{{end}}
    </div>
  </fieldset>
</form>
{{end}}
