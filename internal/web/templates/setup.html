{{define "content"}}
<form class="barecard" method="post" action="/setup" data-nosave>
  <div class="barefields">
    <div class="barehead"><h1>Set up YARS</h1>{{if not simple}}<span class="tag role">director</span>{{end}}<span class="tag adminflag">admin</span></div>
    <label>Username<input name="username" value="{{.Form.Get "username"}}" autocomplete="username" pattern="[A-Za-z0-9._\-]+" required autofocus></label>
    <label>Email<input name="email" type="email" value="{{.Form.Get "email"}}" autocomplete="email"></label>
    <label>Password<input name="password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>Repeat<input name="repeat" type="password" autocomplete="new-password" minlength="10" required></label>
    <div class="alertslot">{{with .Error}}<div class="alert" role="alert">{{.}}</div>{{end}}</div>
  </div>
  <button class="btn primary barebtn">Create account</button>
</form>
{{end}}
