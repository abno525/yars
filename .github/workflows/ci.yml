name: ci
# once per change: a PR's runs, and master's after a merge; by hand from the
# Actions tab (with the race step) for any branch
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
# a newer push to a PR cancels its older run; master's runs all finish
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: git identity for the tests
        run: |
          git config --global user.name ci
          git config --global user.email ci@yars.local
          git config --global init.defaultBranch main
      - name: tidy
        run: go mod tidy -diff
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...
      # 12 of a run's 18 minutes: on master and by hand, not on every PR push
      - name: race
        if: github.event_name != 'pull_request'
        run: go test -race ./internal/store ./internal/db ./internal/index ./internal/events ./internal/web
